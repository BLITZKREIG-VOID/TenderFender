AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TenderFender: a single Lambda Function URL serving both the FastAPI API and the built React UI,
  plus Cognito sign-in (email/password and Google), a DynamoDB users table and cost-alert budgets.
  Sized for the AWS Free Tier with optional EventBridge keep-warm schedule.

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the Lambda zip (the versioned deploy bucket).
  CodeKey:
    Type: String
    Description: S3 key of the Lambda zip (content-hash named).
  BudgetEmail:
    Type: String
    Default: ""
    Description: >-
      Optional. If set, creates three $100 monthly COST budgets that email this address when actual spend
      passes $10, $20, $30, $40, $50, then every $5 up to $100 (15 alerts; AWS allows 5 per budget).
  AuthDomainPrefix:
    Type: String
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    Description: >-
      Cognito managed-login prefix domain: <prefix>.auth.<region>.amazoncognito.com. Globally unique per
      Region; lowercase letters, digits and hyphens; must not contain aws, amazon or cognito.
  SiteUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[a-z0-9.-]+/$"
    Description: >-
      This stack's Function URL (with trailing slash), passed back in by deploy_aws.sh to register the Cognito
      callback/logout URLs. Empty on the first deploy: the Function URL does not exist yet, and referencing it
      directly would be a circular dependency (Lambda env -> app client -> Function URL -> Lambda).
  GoogleClientId:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional. Google OAuth web client id. Empty = no Google sign-in (email/password only).
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Google OAuth web client secret (required when GoogleClientId is set).
  KeepWarm:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: If true, creates an EventBridge rule that invokes the Lambda every 5 minutes to prevent cold starts.
  DevCallbackUrl:
    Type: String
    Default: ""
    Description: Optional dev callback URL (e.g. http://localhost:5173/auth/callback) for local UI testing. Leave empty in production.
  LlmFeaturesEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Kill switch for BYOK LLM routes. Set to false to return 503 llm_disabled while keeping public demo online.
  SiteAiEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable site AI on Amazon Bedrock when the user does not provide their own API key.
  SiteAiMonthlyCapUsd:
    Type: Number
    Default: 10
    Description: Hard monthly spend cap in USD for site AI calls on Amazon Bedrock.
  BedrockModelId:
    Type: String
    Default: "openai.gpt-oss-120b-1:0"
    Description: Bedrock foundation model ID for site AI inference.
  BedrockPriceInPerMtok:
    Type: Number
    Default: 0.18
    Description: Estimated Bedrock input token price in USD per million tokens.
  BedrockPriceOutPerMtok:
    Type: Number
    Default: 0.71
    Description: Estimated Bedrock output token price in USD per million tokens.

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]
  IsKeepWarm: !Equals [!Ref KeepWarm, "true"]
  HasSiteUrl: !Not [!Equals [!Ref SiteUrl, ""]]
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  HasDevCallbackUrl: !Not [!Equals [!Ref DevCallbackUrl, ""]]

Rules:
  GoogleSecretWithClientId:
    RuleCondition: !Not [!Equals [!Ref GoogleClientId, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref GoogleClientSecret, ""]]
        AssertDescription: GoogleClientSecret is required when GoogleClientId is set.

Resources:
  # ── API Lambda ─────────────────────────────────────────────────────────────
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 7

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ApiLogGroup.Arn}:*"
        - PolicyName: users-table-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt UsersTable.Arn
        - PolicyName: cognito-admin-delete-user
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminDeleteUser
                Resource: !GetAtt UserPool.Arn
        - PolicyName: bedrock-invoke-gpt-oss
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/openai.gpt-oss-120b-1:0"

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Description: TenderFender FastAPI (Mangum) serving API and static UI behind a Function URL
      Runtime: python3.14
      Architectures: [x86_64]
      Handler: api.lambda_handler.handler
      MemorySize: 1024
      Timeout: 60
      Role: !GetAtt ApiRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          MOCK: "0"
          CONFIRMATIONS_PATH: /tmp/confirmations.json
          USERS_TABLE: !Ref UsersTable
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_DOMAIN: !Sub "${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
          LLM_FEATURES_ENABLED: !Ref LlmFeaturesEnabled
          DAILY_LIMIT_REGEN: "10"
          DAILY_LIMIT_COMPILE: "5"
          DAILY_LIMIT_CHAT: "30"
          DAILY_LIMIT_DETECT: "20"
          GLOBAL_DAILY_LIMIT_LLM: "150"
          GLOBAL_DAILY_LIMIT_DETECT: "300"
          SITE_AI_ENABLED: !Ref SiteAiEnabled
          SITE_AI_MONTHLY_CAP_USD: !Ref SiteAiMonthlyCapUsd
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_PRICE_IN_PER_MTOK: !Ref BedrockPriceInPerMtok
          BEDROCK_PRICE_OUT_PER_MTOK: !Ref BedrockPriceOutPerMtok

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE

  ApiUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiInvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ── Keep-Warm (EventBridge) ────────────────────────────────────────────────
  KeepWarmRule:
    Type: AWS::Events::Rule
    Condition: IsKeepWarm
    Properties:
      Name: !Sub "${AWS::StackName}-keep-warm"
      Description: Invokes TenderFender Lambda every 5 minutes to keep it warm
      ScheduleExpression: "rate(5 minutes)"
      State: ENABLED
      Targets:
        - Id: KeepWarmTarget
          Arn: !GetAtt ApiFunction.Arn

  KeepWarmPermission:
    Type: AWS::Lambda::Permission
    Condition: IsKeepWarm
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt KeepWarmRule.Arn

  # ── Cognito User Pool & Auth ──────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UserPoolTier: LITE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      DeletionProtection: INACTIVE

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        name: name
        username: sub

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AuthDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        !If
          - HasGoogle
          - - !Ref GoogleIdentityProvider
            - COGNITO
          - - COGNITO
      PreventUserExistenceErrors: ENABLED
      CallbackURLs:
        !If
          - HasDevCallbackUrl
          - !If
              - HasSiteUrl
              - - !Sub "${SiteUrl}auth/callback"
                - !Ref DevCallbackUrl
              - - !Ref DevCallbackUrl
          - !If
              - HasSiteUrl
              - - !Sub "${SiteUrl}auth/callback"
              - - "https://localhost/auth/callback"
      LogoutURLs:
        !If
          - HasDevCallbackUrl
          - !If
              - HasSiteUrl
              - - !Ref SiteUrl
                - "http://localhost:5173/"
              - - "http://localhost:5173/"
          - !If
              - HasSiteUrl
              - - !Ref SiteUrl
              - - "https://localhost/"
  # ── DynamoDB Users Table ──────────────────────────────────────────────────
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-users"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 10
        WriteCapacityUnits: 10
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # ── Cost Guards (3 budgets, 15 absolute-value thresholds) ──────────────────
  CostBudget10To50:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-spend-10-to-50"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 100
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 10
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 20
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 30
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 40
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

  CostBudget55To75:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-spend-55-to-75"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 100
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 55
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 60
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 65
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 70
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 75
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

  CostBudget80To100:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-spend-80-to-100"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 100
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 85
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 90
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 95
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

  # ── Bedrock Site AI Cost Budget & Deny Action ──────────────────────────────
  BedrockCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-bedrock-cost-budget"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref SiteAiMonthlyCapUsd
          Unit: USD
        CostFilters:
          Service:
            - Amazon Bedrock
      NotificationsWithSubscribers:
        !If
          - HasBudgetEmail
          - - Notification:
                NotificationType: ACTUAL
                ComparisonOperator: GREATER_THAN
                Threshold: 50
                ThresholdType: PERCENTAGE
              Subscribers:
                - SubscriptionType: EMAIL
                  Address: !Ref BudgetEmail
            - Notification:
                NotificationType: ACTUAL
                ComparisonOperator: GREATER_THAN
                Threshold: 100
                ThresholdType: PERCENTAGE
              Subscribers:
                - SubscriptionType: EMAIL
                  Address: !Ref BudgetEmail
          - !Ref "AWS::NoValue"

  BudgetsActionExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasBudgetEmail
    Properties:
      RoleName: !Sub "${AWS::StackName}-budgets-action-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: apply-deny-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !GetAtt ApiRole.Arn

  BedrockDenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasBudgetEmail
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-bedrock-deny"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Action:
              - "bedrock:InvokeModel*"
            Resource: "*"

  BedrockCostBudgetAction:
    Type: AWS::Budgets::BudgetsAction
    Condition: HasBudgetEmail
    Properties:
      BudgetName: !Ref BedrockCostBudget
      ActionType: APPLY_IAM_POLICY
      ApprovalModel: AUTOMATIC
      ActionThreshold:
        Type: PERCENTAGE
        Value: 100
      ExecutionRoleArn: !GetAtt BudgetsActionExecutionRole.Arn
      NotificationType: ACTUAL
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref BedrockDenyPolicy
          Roles:
            - !Ref ApiRole
      Subscribers:
        - Type: EMAIL
          Address: !Ref BudgetEmail

Outputs:
  SiteUrl:
    Description: Public URL serving UI and API
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref ApiFunction
  FunctionUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito Web Client ID
    Value: !Ref UserPoolClient
  AuthDomain:
    Description: Cognito Managed Login Domain
    Value: !Sub "${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  UsersTableName:
    Description: DynamoDB Users Table Name
    Value: !Ref UsersTable
